[project]
name = "karsija"
version = "0.1.0"
description = "Photo culling helper: finds blurry shots and picks the best of each burst."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.1",
    "rawpy>=0.19",
    "uvicorn>=0.30",
]

[project.scripts]
karsija = "karsija.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["karsija"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# the HTML report template is emitted verbatim; its lines are not wrapped
"karsija/cli.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["karsija"]
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["rawpy", "rawpy.*"]
ignore_missing_imports = true
